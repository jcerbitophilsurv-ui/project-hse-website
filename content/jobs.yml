jobs:
  - location: Cainta, Rizal
    type: Full-time
    title: Solar Installer
    summary: >-
      About the Role


      We're looking for a Solar Installer to join our field team in installing, commissioning, and maintaining solar PV systems for residential, commercial, and industrial clients. You'll work alongside our engineers and technicians to deliver safe, high-quality installations on schedule.


      Responsibilities

      - Install solar PV systems, including mounting structures, panels, inverters, combiner boxes, and batteries where applicable

      - Run and terminate DC and AC cabling, conduit, grounding, and protective devices according to the approved plans

      - Assist with system testing and commissioning (continuity, polarity, insulation resistance, string voltage and current checks)

      - Read and follow electrical drawings, single-line diagrams, and installation manuals

      - Perform preventive maintenance and troubleshooting on existing systems

      - Follow site safety procedures, including working at heights and proper PPE use

      - Keep tools, materials, and installation records organized and report progress to the site supervisor
    qualifications:
      - Completed senior high school, vocational course, or college in
        electrical, electronics, or a related field
      - At least [1-2] years of experience in solar installation, electrical
        works, or construction (fresh graduates with relevant training may be
        considered)
      - Knowledge of basic electrical principles and the Philippine Electrical
        Code
      - Able to lift heavy equipment and work long hours when needed
      - Comfortable working on rooftops and outdoors in varied weather
      - Willing to travel and be deployed to project sites, including provincial
        areas
      - Valid government IDs and clean background check
    posted_date: 2026-10-07
