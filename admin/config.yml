backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "projects"
    label: "Projects"
    files:
      - file: "content/projects.yml"
        label: "Recent Projects"
        name: "projects"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{title}} — {{location}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Residential", "Commercial", "Community"]
              - { label: "Photo", name: "image", widget: "image", required: false }

  - name: "articles"
    label: "Articles"
    files:
      - file: "content/articles.yml"
        label: "Articles"
        name: "articles"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
              - { label: "Excerpt", name: "excerpt", widget: "text" }
              - { label: "Cover Image", name: "image", widget: "image", required: false }
              - { label: "Body", name: "body", widget: "markdown" }

  - name: "quote_settings"
    label: "Quote Calculator Settings"
    files:
      - file: "content/quote-settings.yml"
        label: "Quote Calculator Assumptions"
        name: "quote_settings"
        fields:
          - { label: "Solar Cost (₱ per kWh)", name: "solar_cost_php_per_kwh", widget: "number", value_type: "float" }

  - name: "jobs"
    label: "Work With Us (Job Postings)"
    files:
      - file: "content/jobs.yml"
        label: "Job Postings"
        name: "jobs"
        fields:
          - label: "Jobs"
            name: "jobs"
            widget: "list"
            summary: "{{title}} — {{location}}"
            fields:
              - { label: "Job Title", name: "title", widget: "string" }
              - { label: "Location", name: "location", widget: "string", default: "Metro Manila, Philippines" }
              - label: "Employment Type"
                name: "type"
                widget: "select"
                options: ["Full-time", "Part-time", "Contract"]
                default: "Full-time"
              - { label: "Summary", name: "summary", widget: "text", hint: "One or two sentences describing the role — shown on the job card." }
              - label: "Qualifications"
                name: "qualifications"
                widget: "list"
                field: { label: "Qualification", name: "item", widget: "string" }
              - { label: "Posted Date", name: "posted_date", widget: "datetime", format: "YYYY-MM-DD" }
