backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "projects"
    label: "Projects"
    files:
      - file: "content/projects.yml"
        label: "Recent Projects"
        name: "projects"
        fields:
          - label: "Projects"
            name: "projects"
            widget: "list"
            summary: "{{title}} — {{location}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Location", name: "location", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Residential", "Commercial", "Community"]
              - { label: "Photo", name: "image", widget: "image", required: false }

  - name: "articles"
    label: "Articles"
    files:
      - file: "content/articles.yml"
        label: "Articles"
        name: "articles"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
              - { label: "Excerpt", name: "excerpt", widget: "text" }
              - { label: "Cover Image", name: "image", widget: "image", required: false }
              - { label: "Body", name: "body", widget: "markdown" }

  - name: "quote_settings"
    label: "Quote Calculator Settings"
    files:
      - file: "content/quote-settings.yml"
        label: "Quote Calculator Assumptions"
        name: "quote_settings"
        fields:
          - { label: "Grid Electricity Cost (₱ per kWh)", name: "electricity_rate_php_per_kwh", widget: "number", value_type: "float" }
          - { label: "Solar Cost (₱ per kWh)", name: "solar_cost_php_per_kwh", widget: "number", value_type: "float" }
          - { label: "Solar Yield (kWh per kWp per day)", name: "yield_kwh_per_kwp_per_day", widget: "number", value_type: "float" }
          - { label: "Panel Wattage (W)", name: "panel_wattage_w", widget: "number" }
          - { label: "On-Grid Installed Cost per kWp — Low (₱)", name: "cost_per_kwp_ongrid_low", widget: "number" }
          - { label: "On-Grid Installed Cost per kWp — High (₱)", name: "cost_per_kwp_ongrid_high", widget: "number" }
          - { label: "Hybrid/Battery Installed Cost per kWp — Low (₱)", name: "cost_per_kwp_hybrid_low", widget: "number" }
          - { label: "Hybrid/Battery Installed Cost per kWp — High (₱)", name: "cost_per_kwp_hybrid_high", widget: "number" }
          - label: "Available Inverter Sizes (kW)"
            name: "inverter_sizes_kw"
            widget: "list"
            summary: "{{fields.size}} kW"
            fields:
              - { label: "Size (kW)", name: "size", widget: "number" }
